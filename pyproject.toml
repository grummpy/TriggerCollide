[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triggercollide"
version = "0.1.0"
description = "Find LoRA trigger words that overlap or clash before you stack them in ComfyUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris" }]
dependencies = ["flask==3.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pillow==12.3.0"]

[project.scripts]
triggercollide = "triggercollide.cli:main"

[tool.setuptools.packages.find]
include = ["triggercollide*"]

[tool.setuptools.package-data]
triggercollide = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
